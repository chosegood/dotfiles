monitor.alsa.rules = [
  # The Audioengine 2+'s CSR USB audio chip reports itself under a
  # generic CSRA64210 vendor string that Linux's USB ID database also
  # matches to a TaoTronics headset, so it shows up with a misleading
  # name/icon. Override it by USB vendor/product ID.
  #
  # It also XRUNs and gets stuck in a snd_pcm_avail-after-recover
  # "Broken pipe" loop (silencing the whole sink) under CPU load, e.g.
  # when WoW is running under wine. It's on a USB hub inside a monitor
  # fed over Thunderbolt, so it's more scheduling/bandwidth-sensitive
  # than a directly attached device. Widen its buffer to give it more
  # margin to absorb jitter without XRUNning.
  {
    matches = [
      {
        device.vendor.id = "0x0a12"
        device.product.id = "0x1243"
      }
    ]
    actions = {
      update-props = {
        device.description = "Audioengine 2+"
        device.nick        = "Audioengine 2+"
        node.description   = "Audioengine 2+"
        node.nick          = "Audioengine 2+"
        device.form_factor = "speaker"
        device.icon_name   = "audio-speakers-usb"
      }
    }
  },
  # api.alsa.period-size/headroom are node-level SPA properties, only
  # picked up when matched by node.name (not by device vendor/product
  # id, which only affects device-level props like the rename above).
  {
    matches = [
      {
        node.name = "~alsa_output.usb-Audioengine_Ltd\\..*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom    = 8192
      }
    }
  }
]
